async function apiCall(payload) {
  if (!API_URL || API_URL.startsWith("COLLEZ")) {
    throw new Error("API_URL non configurée. Voir GUIDE_INSTALLATION.md étape 4.");
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
    redirect: "follow"
  });
  return await res.json();
}

function LoginScreen({ onLogin }) {
  const [login, setLogin] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    if (e) e.preventDefault();
    if (!login.trim() || !password) {
      setError("Identifiant et mot de passe requis");
      return;
    }
    setLoading(true);
    setError("");
    try {
      const res = await apiCall({ action: "login", login: login.trim(), password });
      if (res.ok) {
        sessionStorage.setItem("ap_user", JSON.stringify(res.user));
        onLogin(res.user);
      } else {
        setError(res.error || "Erreur de connexion");
      }

      setError("Impossible de joindre l'API. Vérifiez votre connexion et l'URL API dans le fichier HTML.");

function Root() {

    try {
      const raw = sessionStorage.getItem("ap_user");
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  });

  const handleLogout = () => {
    sessionStorage.removeItem("ap_user");
    setCurrentUser(null);
  };

  if (!currentUser) {
    return <LoginScreen onLogin={setCurrentUser} />;
  }
  return <App currentUser={currentUser} onLogout={handleLogout} />;

// === Helpers ===
const parseFrenchDate = (dateStr) => {
  if (!dateStr) return null;
  const parts = dateStr.split("/");
  if (parts.length !== 3) return null;
  return new Date(parts[2], parts[1] - 1, parts[0]);
};

const TODAY = new Date(2026, 3, 28); // 28 avril 2026

const daysUntil = (dateStr) => {
  const d = parseFrenchDate(dateStr);
  if (!d) return null;
  return Math.floor((d - TODAY) / (1000 * 60 * 60 * 24));
};

const hoursSince = (isoDate) => {
  if (!isoDate) return null;
  return Math.floor((TODAY - new Date(isoDate)) / (1000 * 60 * 60));
};

const formatDateTime = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) + " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
};

// === Score de chaleur enrichi V2 ===
const computeHeat = (offre, suivi) => {
  // Offre clôturée → score = 0 sauf placement (qui doit briller)
  if (suivi.etape && ETAPES_CLOTUREES.includes(suivi.etape)) {
    return suivi.etape === "cloture_placement" ? 100 : 0;
  }
  if (offre.actif === "Inactive") return 0;

  const days = daysUntil(offre.dateDebut);
  const hasContact = !!(offre.tel || offre.portable);
  const restants = offre.nbRestants;
  const places = offre.nbPlaces;

  let score = 0;
  // Urgence temporelle
  if (days !== null) {
    if (days < 0) score += 50;
    else if (days < 30) score += 45;
    else if (days < 60) score += 30;
    else if (days < 90) score += 18;
    else score += 8;
  }
  // Postes restants
  if (restants > 0) score += 20;
  if (restants > 2) score += 10;
  // Quick win : entreprise déjà engagée
  if (places > 0 && restants > 0) score += 15;
  // Contact accessible
  if (hasContact) score += 8;
  else score -= 15;
  if (String(offre.statut).includes("sans contact")) score -= 25;

  // Bonus selon étape de workflow
  if (suivi.etape === "envoi_candidat") score += 25; // suivi urgent
  if (suivi.etape === "qualifiee") score += 10;
  if (suivi.etape === "job_dating") score += 5;

  // PÉNALITÉ INACTIVITÉ — votre demande
  const inactivity = computeInactivityLevel(suivi);
  if (inactivity === "rouge") score += 30; // remonte fort dans les priorités
  else if (inactivity === "orange") score += 15;

  return Math.max(0, Math.min(100, score));
};

// Calcule le niveau d'urgence d'inactivité (24h / 48h / 72h)
const computeInactivityLevel = (suivi) => {
  if (!suivi.lastUpdate) return null;
  if (!suivi.etape || ETAPES_CLOTUREES.includes(suivi.etape)) return null;

  const hours = hoursSince(suivi.lastUpdate);
  if (hours === null) return null;

  // Pour "candidat envoyé" : seuils plus serrés
  if (suivi.etape === "envoi_candidat") {
    if (hours >= 72) return "rouge";
    if (hours >= 48) return "orange";
    if (hours >= 24) return "jaune";
  }
  // Pour les autres étapes actives
  if (["a_appeler", "qualification"].includes(suivi.etape)) {
    if (hours >= 72) return "rouge";
    if (hours >= 48) return "orange";
    if (hours >= 24) return "jaune";
  }
  return null;
};

const heatBadge = (score) => {
  if (score >= 70) return { label: "Brûlante", bg: "#fef2f2", fg: "#dc2626", border: "#fecaca", Icon: Flame };
  if (score >= 50) return { label: "Chaude", bg: "#fff7ed", fg: "#ea580c", border: "#fed7aa", Icon: ThermometerSun };
  if (score >= 30) return { label: "Tiède", bg: "#fefce8", fg: "#ca8a04", border: "#fde68a", Icon: ThermometerSun };
  return { label: "Froide", bg: "#f1f5f9", fg: "#64748b", border: "#e2e8f0", Icon: Snowflake };
};

const inactivityBadge = (level) => {
  if (level === "rouge") return { bg: "#fef2f2", fg: "#dc2626", border: "#fecaca", label: "🚨 +72h sans action" };
  if (level === "orange") return { bg: "#fff7ed", fg: "#ea580c", border: "#fed7aa", label: "⚠️ +48h sans action" };
  if (level === "jaune") return { bg: "#fefce8", fg: "#ca8a04", border: "#fde68a", label: "⏰ +24h sans action" };
  return null;
};


// === App principale ===
function App({ currentUser, onLogout }) {
  const [view, setView] = useState("dashboard");
  const [filterCampus, setFilterCampus] = useState("all");
  const [filterGestionnaire, setFilterGestionnaire] = useState("all");
  const [filterStatut, setFilterStatut] = useState("all");
  const [search, setSearch] = useState("");
  const [selectedOffre, setSelectedOffre] = useState(null);
  const [hideClotures, setHideClotures] = useState(false);
  const [showToast, setShowToast] = useState(null);

  // Suivis : { [offreId]: { etape, origine, gestionnaireSuivi, history: [...], lastUpdate } }
  const [suivis, setSuivis] = useState({});
  const [loadingSuivis, setLoadingSuivis] = useState(true);

  useEffect(() => {
    apiCall({ action: "loadSuivis" })
      .then(res => {
        if (res.ok) setSuivis(res.suivis || {});
        else console.error("Erreur chargement:", res.error);
        setLoadingSuivis(false);
      })
      .catch(err => {
        console.error("API non joignable:", err);
        setLoadingSuivis(false);
      });
  }, []);

  // Toast helper
  const toast = (msg) => {
    setShowToast(msg);
    setTimeout(() => setShowToast(null), 2500);
  };

  // === Mise à jour du suivi d'une offre ===
  const updateSuivi = (offreId, updates) => {
    setSuivis(prev => {
      const current = prev[offreId] || { history: [] };
      const updated = { ...current, ...updates, lastUpdate: new Date().toISOString(), lastUpdateBy: currentUser.login };
      apiCall({ action: "saveSuivi", offreId, suivi: updated, user: currentUser.login })
        .catch(err => console.error("Sauvegarde échouée:", err));
      return { ...prev, [offreId]: updated };
    });
  };

  const addAction = (offreId, action) => {
    const newAction = {
      id: Date.now(),
      date: new Date().toISOString(),
      user: currentUser.login,
      ...action
    };
    setSuivis(prev => {
      const current = prev[offreId] || { history: [] };
      return {
        ...prev,
        [offreId]: {
          ...current,
          history: [newAction, ...(current.history || [])],
          lastUpdate: new Date().toISOString(),
          lastUpdateBy: currentUser.login
        }
      };
    });
    apiCall({ action: "addAction", offreId, action: newAction, user: currentUser.login })
      .catch(err => console.error("Sauvegarde échouée:", err));
    toast("✓ Action ajoutée");
  };

  // === Données enrichies ===
  const enriched = useMemo(() => {
    return RAW_DATA.map(o => {
      const suivi = suivis[o.id] || {};
      return {
        ...o,
        suivi,
        heat: computeHeat(o, suivi),
        daysLeft: daysUntil(o.dateDebut),
        hasContact: !!(o.tel || o.portable),
        inactivityLevel: computeInactivityLevel(suivi),
        isCloture: suivi.etape && ETAPES_CLOTUREES.includes(suivi.etape),
        isUrgent: suivi.etape === "envoi_candidat"
      };
    });
  }, [suivis]);

  const filtered = useMemo(() => {
    return enriched.filter(o => {
      if (hideClotures && o.isCloture) return false;
      if (filterCampus !== "all" && o.campus !== filterCampus) return false;
      if (filterGestionnaire !== "all" && o.gestionnaireOffre !== filterGestionnaire) return false;
      if (filterStatut !== "all") {
        if (filterStatut === "urgent" && o.heat < 70) return false;
        if (filterStatut === "warm" && (o.heat < 50 || o.heat >= 70)) return false;
        if (filterStatut === "noContact" && o.hasContact) return false;
        if (filterStatut === "open" && o.nbRestants === 0) return false;
        if (filterStatut === "inactive" && !o.inactivityLevel) return false;
      }
      if (search) {
        const s = search.toLowerCase();
        if (!o.raisonSociale.toLowerCase().includes(s) &&
            !String(o.intitule).toLowerCase().includes(s) &&
            !String(o.contact).toLowerCase().includes(s)) return false;
      }
      return true;
    });
  }, [enriched, hideClotures, filterCampus, filterGestionnaire, filterStatut, search]);

  const stats = useMemo(() => {
    const totalPostes = filtered.reduce((s, o) => s + o.nbPostes, 0);
    const totalPlaces = filtered.reduce((s, o) => s + o.nbPlaces, 0);
    const totalRestants = filtered.reduce((s, o) => s + o.nbRestants, 0);
    const tauxPlacement = totalPostes > 0 ? (totalPlaces / totalPostes * 100) : 0;
    const urgentes = filtered.filter(o => o.heat >= 70).length;
    const sansContact = filtered.filter(o => !o.hasContact && !o.isCloture).length;
    const inactives = filtered.filter(o => o.inactivityLevel).length;
    const enRecrutement = filtered.filter(o => o.suivi.etape && ["envoi_candidat", "candidature_spontanee", "job_dating"].includes(o.suivi.etape)).length;
    return { totalOffres: filtered.length, totalPostes, totalPlaces, totalRestants, tauxPlacement, urgentes, sansContact, inactives, enRecrutement };
  }, [filtered]);

  const campusList = useMemo(() => [...new Set(enriched.map(o => o.campus).filter(Boolean))].sort(), [enriched]);
  const gestionnaireList = useMemo(() => [...new Set(enriched.map(o => o.gestionnaireOffre).filter(Boolean))].sort(), [enriched]);

  return (
    <div style={{ fontFamily: "'Inter', -apple-system, sans-serif", background: "#faf8f3", minHeight: "100vh", color: "#2a2622" }}>
      <style>{`
        * { box-sizing: border-box; }
        .display { font-family: 'Fraunces', serif; letter-spacing: -0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .card { background: #fff; border: 1px solid #e7e2d8; border-radius: 14px; }
        .card-hover:hover { border-color: #1a1a1a; transition: all 0.15s; cursor: pointer; }
        .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #e7e2d8; background: #fff; font-size: 13px; cursor: pointer; transition: all 0.15s; font-weight: 500; font-family: inherit; }
        .btn:hover { border-color: #1a1a1a; background: #f5f3ee; }
        .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
        .btn-primary:hover { background: #d97706; border-color: #d97706; }
        .btn-danger { background: #dc2626; color: #fff; border-color: #dc2626; }
        .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .input { padding: 8px 12px; border: 1px solid #e7e2d8; border-radius: 8px; background: #fff; font-size: 13px; outline: none; font-family: inherit; }
        .input:focus { border-color: #1a1a1a; }
        .nav-item { padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; transition: all 0.15s; }
        .nav-item:hover { background: rgba(0,0,0,0.04); }
        .nav-active { background: #1a1a1a; color: #fff; }
        .nav-active:hover { background: #1a1a1a; }
        .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .scroll::-webkit-scrollbar-thumb { background: #d6cfbf; border-radius: 4px; }
        .scroll::-webkit-scrollbar-track { background: transparent; }
        .row-cloture { opacity: 0.5; }
        .toast-anim { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
      `}</style>

      <Sidebar view={view} setView={setView} stats={stats} currentUser={currentUser} onLogout={onLogout} />

      <div style={{ marginLeft: 260, padding: "32px 40px", maxWidth: 1600 }}>
        <Header view={view} stats={stats}
          campusList={campusList} gestionnaireList={gestionnaireList}
          filterCampus={filterCampus} setFilterCampus={setFilterCampus}
          filterGestionnaire={filterGestionnaire} setFilterGestionnaire={setFilterGestionnaire}
          filterStatut={filterStatut} setFilterStatut={setFilterStatut}
          search={search} setSearch={setSearch}
          hideClotures={hideClotures} setHideClotures={setHideClotures}
          currentUser={currentUser}
        />

        {view === "dashboard" && <Dashboard stats={stats} filtered={filtered} setSelectedOffre={setSelectedOffre} setView={setView} />}
        {view === "offres" && <OffresList offres={filtered} setSelectedOffre={setSelectedOffre} />}
        {view === "priorites" && <Priorites offres={filtered} setSelectedOffre={setSelectedOffre} />}
        {view === "gestionnaires" && <EspaceGestionnaire offres={filtered} setSelectedOffre={setSelectedOffre} gestionnaireList={gestionnaireList} setFilterGestionnaire={setFilterGestionnaire} setView={setView} />}
        {view === "alertes" && <Alertes offres={enriched} setSelectedOffre={setSelectedOffre} />}
      </div>

      {selectedOffre && (
        <OffreDetail
          offre={selectedOffre}
          onClose={() => setSelectedOffre(null)}
          suivi={suivis[selectedOffre.id] || { history: [] }}
          updateSuivi={(updates) => updateSuivi(selectedOffre.id, updates)}
          addAction={(action) => addAction(selectedOffre.id, action)}
          gestionnaireList={gestionnaireList}
        />
      )}

      {showToast && (
        <div className="toast-anim" style={{ position: "fixed", bottom: 30, left: "50%", transform: "translateX(-50%)", background: "#1a1a1a", color: "#fff", padding: "12px 20px", borderRadius: 10, fontSize: 14, fontWeight: 500, zIndex: 300, boxShadow: "0 10px 30px rgba(0,0,0,0.3)" }}>{showToast}</div>
      )}
    </div>
  );
}

// === Vue Priorités ===
function Priorites({ offres, setSelectedOffre }) {
  const groups = useMemo(() => {
    const sorted = [...offres].sort((a, b) => b.heat - a.heat);
    return {
      hot: sorted.filter(o => o.heat >= 70 && !o.isCloture),
      warm: sorted.filter(o => o.heat >= 50 && o.heat < 70 && !o.isCloture),
      tepid: sorted.filter(o => o.heat >= 30 && o.heat < 50 && !o.isCloture)
    };
  }, [offres]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
      <PrioGroup title="🔥 Brûlantes — À traiter aujourd'hui" desc="Date proche, postes vacants, ou urgence d'inactivité" items={groups.hot} color="#dc2626" setSelectedOffre={setSelectedOffre} />
      <PrioGroup title="🌡️ Chaudes — Cette semaine" desc="Opportunités fortes à activer dans les 7 jours" items={groups.warm} color="#ea580c" setSelectedOffre={setSelectedOffre} />
      <PrioGroup title="☀️ Tièdes — Ce mois-ci" desc="À garder en suivi régulier" items={groups.tepid} color="#ca8a04" setSelectedOffre={setSelectedOffre} />
    </div>
  );
}

function PrioGroup({ title, desc, items, color, setSelectedOffre }) {

// === Liste offres ===
function OffresList({ offres, setSelectedOffre }) {
  const [sort, setSort] = useState("heat");
  const sorted = useMemo(() => {
    const arr = [...offres];
    if (sort === "heat") arr.sort((a, b) => b.heat - a.heat);
    else if (sort === "date") arr.sort((a, b) => (a.daysLeft ?? 999) - (b.daysLeft ?? 999));
    else if (sort === "name") arr.sort((a, b) => a.raisonSociale.localeCompare(b.raisonSociale));
    else if (sort === "inactivity") arr.sort((a, b) => {
      const order = { rouge: 0, orange: 1, jaune: 2, null: 3 };
      return (order[a.inactivityLevel] ?? 3) - (order[b.inactivityLevel] ?? 3);
    });
    return arr;
  }, [offres, sort]);

  return (
    <div className="card" style={{ overflow: "hidden" }}>
      <div style={{ padding: "14px 20px", borderBottom: "1px solid #e7e2d8", display: "flex", alignItems: "center", gap: 14, fontSize: 13 }}>
        <span style={{ fontWeight: 600 }}>{sorted.length} offre{sorted.length > 1 ? "s" : ""}</span>
        <span style={{ marginLeft: "auto", color: "#78716c" }}>Trier :</span>
        <select className="input" value={sort} onChange={e => setSort(e.target.value)}>
          <option value="heat">Priorité (chaleur)</option>
          <option value="date">Date de démarrage</option>
          <option value="inactivity">Urgence d'inactivité</option>
          <option value="name">Nom entreprise</option>
        </select>
      </div>
      <div className="scroll" style={{ maxHeight: "calc(100vh - 280px)", overflowY: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead style={{ position: "sticky", top: 0, background: "#faf8f3", zIndex: 1 }}>
            <tr style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1 }}>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Score</th>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Entreprise / Offre</th>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Étape workflow</th>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Campus</th>
              <th style={{ textAlign: "center", padding: "12px 16px", fontWeight: 600 }}>Postes</th>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Démarrage</th>
              <th style={{ textAlign: "left", padding: "12px 16px", fontWeight: 600 }}>Gestionnaire</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(o => {
              const heat = heatBadge(o.heat);
              const HeatIcon = heat.Icon;
              const etape = o.suivi.etape ? ETAPES[o.suivi.etape] : null;
              const inact = inactivityBadge(o.inactivityLevel);
              return (
                <tr key={o.id} onClick={() => setSelectedOffre(o)} className={o.isCloture ? "row-cloture" : ""} style={{ cursor: "pointer", borderTop: "1px solid #f0ebde", fontSize: 13, background: o.isUrgent ? "#fef2f2" : "transparent" }} onMouseEnter={e => e.currentTarget.style.background = o.isUrgent ? "#fee2e2" : "#faf8f3"} onMouseLeave={e => e.currentTarget.style.background = o.isUrgent ? "#fef2f2" : "transparent"}>
                  <td style={{ padding: "12px 16px" }}>
                    <span className="badge" style={{ background: heat.bg, color: heat.fg, border: `1px solid ${heat.border}` }}>
                      <HeatIcon size={10} /> {o.heat}
                    </span>
                    {inact && <div style={{ marginTop: 4 }}><span className="badge" style={{ background: inact.bg, color: inact.fg, border: `1px solid ${inact.border}`, fontSize: 9 }}>{inact.label}</span></div>}
                  </td>
                  <td style={{ padding: "12px 16px" }}>

                      <div>

// === ESPACE GESTIONNAIRE ===
function EspaceGestionnaire({ offres, setSelectedOffre, gestionnaireList, setFilterGestionnaire, setView }) {
  const [selectedGest, setSelectedGest] = useState("all");

  const myOffres = useMemo(() => {
    if (selectedGest === "all") return offres;
    return offres.filter(o => o.gestionnaireOffre === selectedGest);
  }, [offres, selectedGest]);

  const buckets = useMemo(() => {
    return {
      toutes: myOffres,
      nonQualifiees: myOffres.filter(o => !o.suivi.etape || ["a_appeler", "qualification"].includes(o.suivi.etape)),
      qualifiees: myOffres.filter(o => o.suivi.etape === "qualifiee"),
      enRecrutement: myOffres.filter(o => o.suivi.etape && ["envoi_candidat", "candidature_spontanee", "job_dating"].includes(o.suivi.etape)),
      cloturees: myOffres.filter(o => o.isCloture),
      urgences: myOffres.filter(o => o.inactivityLevel || o.isUrgent)
    };
  }, [myOffres]);

  const [activeBucket, setActiveBucket] = useState("toutes");

  const tabs = [
    { id: "toutes", label: "Toutes mes offres", count: buckets.toutes.length, color: "#1a1a1a" },
    { id: "nonQualifiees", label: "Non qualifiées", count: buckets.nonQualifiees.length, color: "#64748b" },
    { id: "qualifiees", label: "Qualifiées", count: buckets.qualifiees.length, color: "#16a34a" },
    { id: "enRecrutement", label: "En recrutement", count: buckets.enRecrutement.length, color: "#dc2626" },
    { id: "urgences", label: "Urgences", count: buckets.urgences.length, color: "#ea580c" },
    { id: "cloturees", label: "Clôturées", count: buckets.cloturees.length, color: "#78716c" }
  ];

  return (
    <div>
      <div className="card" style={{ padding: 22, marginBottom: 18 }}>
        <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 8 }}>Sélectionner un gestionnaire</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className={"btn " + (selectedGest === "all" ? "btn-primary" : "")} onClick={() => setSelectedGest("all")}>👥 Toute l'équipe ({offres.length})</button>
          {gestionnaireList.map(g => {
            const count = offres.filter(o => o.gestionnaireOffre === g).length;
            if (count === 0) return null;
            return (
              <button key={g} className={"btn " + (selectedGest === g ? "btn-primary" : "")} onClick={() => setSelectedGest(g)}>
                {g} <span style={{ opacity: 0.6 }}>({count})</span>
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 10, marginBottom: 18 }}>
        {tabs.map(t => (
          <div key={t.id} onClick={() => setActiveBucket(t.id)} className="card-hover" style={{ padding: 16, border: activeBucket === t.id ? `2px solid ${t.color}` : "1px solid #e7e2d8", borderRadius: 12, background: activeBucket === t.id ? "#faf8f3" : "#fff", cursor: "pointer" }}>
            <div style={{ fontSize: 10, color: "#78716c", textTransform: "uppercase", letterSpacing: 1, fontWeight: 600, marginBottom: 6 }}>{t.label}</div>
            <div className="display" style={{ fontSize: 26, fontWeight: 700, color: t.color, lineHeight: 1 }}>{t.count}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{ padding: 24 }}>
        <h3 className="display" style={{ fontSize: 22, margin: "0 0 16px", fontWeight: 600 }}>{tabs.find(t => t.id === activeBucket)?.label} — {selectedGest === "all" ? "toute l'équipe" : selectedGest}</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {buckets[activeBucket].length === 0 ? (
            <div style={{ textAlign: "center", padding: 40, color: "#78716c", fontSize: 14, fontStyle: "italic" }}>Aucune offre dans cette catégorie</div>
          ) : buckets[activeBucket].sort((a, b) => b.heat - a.heat).slice(0, 30).map(o => <PriorityRow key={o.id} offre={o} onClick={() => setSelectedOffre(o)} />)}
          {buckets[activeBucket].length > 30 && <div style={{ textAlign: "center", padding: 10, fontSize: 12, color: "#78716c" }}>+ {buckets[activeBucket].length - 30} autres offres</div>}
        </div>
      </div>
    </div>
  );
}

// === Alertes ===
function Alertes({ offres, setSelectedOffre }) {
  const inactives24h = offres.filter(o => o.inactivityLevel === "jaune");
  const inactives48h = offres.filter(o => o.inactivityLevel === "orange");
  const inactives72h = offres.filter(o => o.inactivityLevel === "rouge");
  const sansContact = offres.filter(o => !o.hasContact && o.actif === "Active" && !o.isCloture);
  const urgentes = offres.filter(o => {
    const d = o.daysLeft;
    return d !== null && d < 30 && o.nbRestants > 0 && !o.isCloture;
  });
  const suiviUrgent = offres.filter(o => o.isUrgent);

  const sections = [
    { title: "🚨 Suivi urgent — Candidat envoyé", desc: "À relancer en priorité absolue pour confirmer ou non le placement", items: suiviUrgent, severity: "high" },
    { title: "🚨 Inactives depuis +72 heures", desc: "Aucune action depuis 3 jours — relance critique", items: inactives72h, severity: "high" },
    { title: "⚠️ Inactives depuis +48 heures", desc: "À reprendre rapidement", items: inactives48h, severity: "medium" },
    { title: "⏰ Inactives depuis +24 heures", desc: "Premier signal d'alerte", items: inactives24h, severity: "low" },
    { title: "📵 Offres sans coordonnées de contact", desc: "Impossible de relancer — coordonnées à compléter", items: sansContact, severity: "medium" },
    { title: "📅 Démarrage imminent (< 30 jours) avec postes vacants", desc: "Risque de perte de partenariat si non placé à temps", items: urgentes, severity: "high" }
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {sections.map((s, i) => (
        <div key={i} className="card" style={{ padding: 24 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 6 }}>
            <div style={{ padding: 8, borderRadius: 8, background: s.severity === "high" ? "#fef2f2" : s.severity === "medium" ? "#fff7ed" : "#fefce8" }}>
              <AlertCircle size={16} color={s.severity === "high" ? "#dc2626" : s.severity === "medium" ? "#ea580c" : "#ca8a04"} />
            </div>
            <div style={{ flex: 1 }}>
              <div className="display" style={{ fontSize: 18, fontWeight: 600 }}>{s.title}</div>
              <div style={{ fontSize: 12, color: "#78716c", marginTop: 2 }}>{s.desc}</div>
            </div>
            <div className="badge" style={{ background: s.severity === "high" ? "#fef2f2" : s.severity === "medium" ? "#fff7ed" : "#fefce8", color: s.severity === "high" ? "#dc2626" : s.severity === "medium" ? "#ea580c" : "#ca8a04", border: `1px solid ${s.severity === "high" ? "#fecaca" : s.severity === "medium" ? "#fed7aa" : "#fde68a"}` }}>{s.items.length}</div>
          </div>
          {s.items.length > 0 && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 6 }}>
              {s.items.slice(0, 8).map(item => (
                <div key={item.id} onClick={() => setSelectedOffre(item)} style={{ padding: "10px 14px", background: "#faf8f3", borderRadius: 8, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
                  <div>
                    <span style={{ fontWeight: 500 }}>{item.raisonSociale}</span>
                    <span style={{ color: "#78716c", marginLeft: 8 }}>· {item.intitule}</span>
                    <span style={{ color: "#78716c", marginLeft: 8, fontSize: 11 }}>· {item.gestionnaireOffre}</span>
                  </div>
                  <ChevronRight size={14} color="#78716c" />
                </div>
              ))}
              {s.items.length > 8 && <div style={{ textAlign: "center", padding: 8, fontSize: 12, color: "#78716c" }}>+ {s.items.length - 8} autres</div>}
            </div>
          )}
        </div>
      ))}
    </div>
  );

// === Panneau de détail offre avec workflow CRM ===
function OffreDetail({ offre, onClose, suivi, updateSuivi, addAction, gestionnaireList }) {

  const HeatIcon = heat.Icon;

  const [actionType, setActionType] = useState("note");

  const submitAction = () => {
    if (!comment.trim()) {
      alert("Veuillez saisir un commentaire");
      return;
    }
    addAction({ type: actionType, comment: comment.trim() });
    setComment("");
  };

  const setEtape = (etapeId) => {
    updateSuivi({ etape: etapeId });
    const etapeLabel = ETAPES[etapeId].label;
    addAction({ type: "note", comment: `Étape changée → ${etapeLabel}`, system: true });

    updateSuivi({ origine: origineId });
  };

          {offre.contact ? (
            <>
              <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 8 }}>{offre.contact}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13 }}>
                {offre.tel && <div style={{ display: "flex", alignItems: "center", gap: 8 }}><Phone size={13} color="#78716c" /><a href={`tel:${offre.tel}`} className="mono" style={{ color: "#1a1a1a", textDecoration: "none" }}>{offre.tel}</a></div>}
                {offre.portable && <div style={{ display: "flex", alignItems: "center", gap: 8 }}><PhoneCall size={13} color="#78716c" /><a href={`tel:${offre.portable}`} className="mono" style={{ color: "#1a1a1a", textDecoration: "none" }}>{offre.portable}</a></div>}
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}><MapPin size={13} color="#78716c" />{offre.ville}</div>
              </div>
            </>
          ) : (
            <div style={{ padding: 14, background: "#fef2f2", borderRadius: 8, color: "#dc2626", fontSize: 13 }}>⚠ Aucune coordonnée renseignée</div>
          )}
        </div>

        {/* === ORIGINE === */}
        <div className="card" style={{ padding: 18, marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 12 }}>① Origine de l'offre</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {ORIGINES.map(o => (
              <button key={o.id} onClick={() => setOrigine(o.id)} className="btn" style={{ background: suivi.origine === o.id ? o.color : "#fff", color: suivi.origine === o.id ? "#fff" : "#2a2622", borderColor: suivi.origine === o.id ? o.color : "#e7e2d8", fontSize: 12 }}>
                {o.label}
              </button>
            ))}
          </div>
        </div>

        {/* === WORKFLOW === */}
        <div className="card" style={{ padding: 18, marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 12 }}>② Étape du workflow</div>

          {/* Phase Traitement */}
          <div style={{ fontSize: 11, fontWeight: 600, color: "#78716c", marginBottom: 6 }}>Traitement</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
            {Object.entries(ETAPES).filter(([_, e]) => e.phase === "traitement").map(([id, e]) => (
              <button key={id} onClick={() => setEtape(id)} className="btn" style={{ background: suivi.etape === id ? e.color : "#fff", color: suivi.etape === id ? "#fff" : "#2a2622", borderColor: suivi.etape === id ? e.color : "#e7e2d8", fontSize: 12 }}>
                {e.label}
              </button>
            ))}
          </div>

          {/* Phase Recrutement */}
          <div style={{ fontSize: 11, fontWeight: 600, color: "#78716c", marginBottom: 6 }}>Process de recrutement</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
            {Object.entries(ETAPES).filter(([_, e]) => e.phase === "recrutement").map(([id, e]) => (
              <button key={id} onClick={() => setEtape(id)} className="btn" style={{ background: suivi.etape === id ? e.color : "#fff", color: suivi.etape === id ? "#fff" : "#2a2622", borderColor: suivi.etape === id ? e.color : "#e7e2d8", fontSize: 12 }}>
                {e.urgent && "⚠ "}{e.label}
              </button>
            ))}
          </div>

          {/* Si envoi candidat → champ gestionnaire suivi obligatoire */}
          {suivi.etape === "envoi_candidat" && (
            <div style={{ padding: 14, background: "#fef2f2", borderRadius: 10, marginBottom: 14, border: "1px solid #fecaca" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#dc2626", marginBottom: 8 }}>⚠ Suivi urgent activé — Personne en charge du suivi :</div>
              <select className="input" value={suivi.gestionnaireSuivi || ""} onChange={e => setGestionnaireSuivi(e.target.value)} style={{ width: "100%" }}>
                <option value="">— Sélectionner —</option>
                {gestionnaireList.map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </div>
          )}

          {/* Phase Clôture */}
          <div style={{ fontSize: 11, fontWeight: 600, color: "#78716c", marginBottom: 6 }}>Clôture</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {Object.entries(ETAPES).filter(([_, e]) => e.phase === "cloture").map(([id, e]) => (
              <button key={id} onClick={() => setEtape(id)} className="btn" style={{ background: suivi.etape === id ? e.color : "#fff", color: suivi.etape === id ? "#fff" : "#2a2622", borderColor: suivi.etape === id ? e.color : "#e7e2d8", fontSize: 12 }}>
                {e.success && "✓ "}{e.label}
              </button>
            ))}
          </div>

          {suivi.etape === "cloture_autre" && (
            <div style={{ marginTop: 12, padding: 14, background: "#fefce8", borderRadius: 10, border: "1px solid #fde68a" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#ca8a04", marginBottom: 6 }}>Précisez la raison :</div>
              <textarea className="input" value={suivi.raisonAutre || ""} onChange={e => updateSuivi({ raisonAutre: e.target.value })} placeholder="Décrivez la raison de la clôture..." style={{ width: "100%", minHeight: 60, resize: "vertical" }} />
            </div>
          )}
        </div>

        {/* === AJOUTER UNE ACTION === */}
        <div className="card" style={{ padding: 18, marginBottom: 16, borderColor: "#1a1a1a" }}>
          <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 12 }}>③ Ajouter une action / commentaire</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {ACTIONS_TYPES.map(a => (
              <button key={a.id} onClick={() => setActionType(a.id)} className="btn" style={{ background: actionType === a.id ? a.color : "#fff", color: actionType === a.id ? "#fff" : "#2a2622", borderColor: actionType === a.id ? a.color : "#e7e2d8", fontSize: 12 }}>
                {a.label}
              </button>
            ))}
          </div>
          <textarea className="input" placeholder="Commentaire (obligatoire) : ce que vous avez fait, retenu, ce qu'il faut faire ensuite…" value={comment} onChange={e => setComment(e.target.value)} style={{ width: "100%", minHeight: 80, resize: "vertical" }} />
          <button className="btn btn-primary" onClick={submitAction} style={{ marginTop: 10, width: "100%" }}>+ Ajouter au journal</button>
        </div>

        {/* === HISTORIQUE === */}
        <div className="card" style={{ padding: 18, marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 12 }}>📜 Historique des actions ({(suivi.history || []).length})</div>
          {(suivi.history || []).length === 0 ? (
            <div style={{ padding: 14, background: "#faf8f3", borderRadius: 8, color: "#78716c", fontSize: 13, fontStyle: "italic", textAlign: "center" }}>Aucune action enregistrée pour cette offre</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {(suivi.history || []).map(h => {
                const action = ACTIONS_TYPES.find(a => a.id === h.type);
                return (
                  <div key={h.id} style={{ padding: "10px 14px", background: h.system ? "#faf8f3" : "#fff", borderLeft: `3px solid ${action?.color || "#78716c"}`, borderRadius: 6, fontSize: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ fontWeight: 600, color: action?.color || "#78716c" }}>{action?.label || h.type}</span>
                      <span style={{ color: "#78716c", fontSize: 11 }} className="mono">{formatDateTime(h.date)}</span>
                    </div>
                    <div style={{ color: "#2a2622", lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{h.comment}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* === EMAIL DE RELANCE === */}
        <div className="card" style={{ padding: 18 }}>
          <div style={{ fontSize: 11, color: "#78716c", textTransform: "uppercase", letterSpacing: 1.2, fontWeight: 600, marginBottom: 10 }}>✉ Modèle d'email de relance</div>
          <div style={{ fontSize: 12, background: "#faf8f3", padding: 14, borderRadius: 8, lineHeight: 1.6, fontFamily: "Georgia, serif" }}>
            <div><strong>Objet :</strong> {offre.intitule} — Suivi de votre offre d'alternance</div>
            <hr style={{ border: 0, borderTop: "1px solid #e7e2d8", margin: "10px 0" }} />
            <div>Bonjour {offre.contact ? offre.contact.split(" ").pop() : "—"},</div>
            <br />
            <div>Je reviens vers vous au sujet de votre offre <em>« {offre.intitule} »</em> publiée pour un démarrage le {offre.dateDebut}.</div>
            <br />
            <div>Nous avons identifié plusieurs candidats issus du Campus {offre.campus} dont les profils correspondent à vos attentes. Souhaitez-vous que je vous présente leurs CV cette semaine ?</div>
            <br />
            <div>Bien cordialement,<br />{offre.gestionnaireOffre}</div>
          </div>
          <button className="btn btn-primary" style={{ marginTop: 12, width: "100%" }} onClick={() => {
            const subject = encodeURIComponent(`${offre.intitule} — Suivi de votre offre d'alternance`);
            const body = encodeURIComponent(`Bonjour ${offre.contact ? offre.contact.split(" ").pop() : "—"},\n\nJe reviens vers vous au sujet de votre offre « ${offre.intitule} » publiée pour un démarrage le ${offre.dateDebut}.\n\nNous avons identifié plusieurs candidats issus du Campus ${offre.campus} dont les profils correspondent à vos attentes. Souhaitez-vous que je vous présente leurs CV cette semaine ?\n\nBien cordialement,\n${offre.gestionnaireOffre}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
          }}>📧 Ouvrir dans ma messagerie</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
setTimeout(() => { const l = document.getElementById('loader'); if (l) l.style.display = 'none'; }, 100);
</script>
</body>
</html>
